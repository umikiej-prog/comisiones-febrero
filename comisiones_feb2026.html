<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Comisiones Fudo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
    :root{--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--muted:#6e6e73;--line:#e5e5e7;--blue:#0071e3;--green:#16a34a;--orange:#f59e0b;--red:#dc2626;--chip:#f2f2f2;--shadow:0 4px 20px rgba(0,0,0,.06);--radius:16px}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
    .wrap{max-width:1700px;margin:0 auto;padding:28px 20px 60px}
    h1{font-size:30px;font-weight:800;letter-spacing:-.03em;margin:0 0 4px}
    .sub{color:var(--muted);font-size:13px;margin:0 0 18px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}

    /* TOP NAV */
    .topnav{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;align-items:center}
    .topnav-page{padding:8px 16px;border-radius:999px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font:inherit;font-size:13px;font-weight:700;color:var(--muted);transition:all .15s}
    .topnav-page:hover{border-color:#aaa;color:var(--text)}
    .topnav-page.active{background:var(--text);color:#fff;border-color:var(--text)}
    .topnav-sep{width:1px;height:24px;background:var(--line);margin:0 4px}

    /* CONTROLS */
    .controls{padding:14px 16px;display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
    .ctrl{display:flex;flex-direction:column;gap:5px}
    .ctrl.wide{min-width:240px}
    label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
    input,select{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font:inherit;font-size:13px;color:var(--text);outline:none;min-width:130px}
    input:focus,select:focus{border-color:var(--blue)}
    button{border:none;border-radius:10px;padding:9px 18px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
    .btn-primary{background:var(--text);color:#fff}
    .btn-primary:hover{opacity:.88}

    /* TEAM TABS */
    .team-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
    .team-tab{padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font:inherit;font-size:12px;font-weight:700;color:var(--muted)}
    .team-tab:hover{border-color:#aaa;color:var(--text)}
    .team-tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}

    /* FILTER ROW */
    .filter-row{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
    .filter-row input{min-width:200px}
    .status{font-size:12px;color:var(--muted);padding:2px 0}

    /* SUMMARY */
    .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
    .stat{padding:14px 16px}.stat .k{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}.stat .v{font-size:24px;font-weight:800;letter-spacing:-.03em;margin-top:5px}

    /* TABLE */
    .tableWrap{overflow-x:auto;border-radius:var(--radius)}
    table{width:100%;border-collapse:separate;border-spacing:0}
    thead th{background:#fafafa;font-size:11px;font-weight:700;color:var(--muted);text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap;letter-spacing:.3px}
    thead th.r{text-align:right}
    tbody td{padding:10px 10px;border-bottom:1px solid var(--line);font-size:12px;vertical-align:middle;white-space:nowrap}
    tbody td.r{text-align:right}
    tbody tr:last-child td{border-bottom:none}
    tbody tr:hover td{background:#fafafa}
    .name{font-weight:700;font-size:13px}
    .pill{display:inline-flex;align-items:center;padding:3px 8px;border-radius:999px;background:var(--chip);font-weight:700;font-size:11px}
    .g0{background:#f3f4f6;color:#4b5563}.g1{background:#eff6ff;color:#1d4ed8}.g2{background:#ecfeff;color:#0f766e}.g3{background:#f0fdf4;color:#15803d}.g4{background:#fff7ed;color:#c2410c}
    .ok{color:var(--green);font-weight:600}
    .muted{color:var(--muted)}
    .pct-wrap{display:inline-flex;align-items:center;gap:5px}
    .pct-bar{display:inline-block;width:40px;height:4px;background:#e5e5e7;border-radius:3px;position:relative;flex-shrink:0}
    .pct-fill{position:absolute;left:0;top:0;height:100%;border-radius:3px;background:var(--blue)}
    .lite-badge{display:inline-block;padding:1px 6px;border-radius:4px;background:#fef9c3;color:#854d0e;font-size:10px;font-weight:700}
    .footer{margin-top:10px;color:var(--muted);font-size:11px}
    .empty{padding:24px;text-align:center;color:var(--muted);font-size:13px}

    /* ── CARTAS ── */
    .cartas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px;margin-top:4px}
    .carta{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:24px 26px;box-shadow:var(--shadow)}
    .carta-header{margin-bottom:18px}
    .carta-nombre{font-size:18px;font-weight:800;letter-spacing:-.02em;margin:0 0 2px}
    .carta-meta{font-size:12px;color:var(--muted)}
    .carta-section{margin-bottom:14px}
    .carta-section-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
    .carta-row{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;font-size:13px;border-bottom:1px solid #f5f5f5}
    .carta-row:last-child{border-bottom:none}
    .carta-row .cr-label{color:var(--text)}
    .carta-row .cr-sub{font-size:11px;color:var(--muted);margin-top:1px}
    .carta-row .cr-val{font-weight:700;text-align:right}
    .carta-row .cr-val.ok{color:var(--green)}
    .carta-total{margin-top:16px;padding-top:14px;border-top:2px solid var(--text);display:flex;justify-content:space-between;align-items:baseline}
    .carta-total .ct-label{font-size:13px;font-weight:700}
    .carta-total .ct-val{font-size:22px;font-weight:800;letter-spacing:-.03em;color:var(--green)}
    /* ── M2 RETENCIÓN ── */
    .m2-sep{height:1px;background:var(--line);margin:6px 0}
    .m2-final{margin-top:10px;padding:10px 12px;background:#f0fdf4;border-radius:10px;border:1px solid #bbf7d0;display:flex;justify-content:space-between;align-items:center}
    .m2-final-label{font-size:11px;font-weight:700;color:#15803d;text-transform:uppercase;letter-spacing:.5px}
    .m2-final-val{font-size:18px;font-weight:800;letter-spacing:-.03em;color:var(--green)}
    .badge-m2{display:inline-block;padding:1px 6px;border-radius:4px;background:#fef9c3;color:#854d0e;font-size:9px;font-weight:700;vertical-align:middle;margin-left:5px;letter-spacing:.5px;text-transform:uppercase}
    .carta-total.m2-muted .ct-val{color:var(--muted);font-size:16px}
    /* ── M2 fila en tabla resumen ── */
    .section-subtitle{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
    .m2-tr td{background:#f0fdf4;border-top:none!important;padding:3px 10px 5px;font-size:11.5px}
    .m2-tr .m2-tr-label{color:#15803d;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .m2-tr .m2-tr-label .badge-m2{margin-left:0}
    .m2-tr .m2-tr-sep{color:#bbf7d0;margin:0 2px}
    .m2-tr-total{color:var(--green)!important;font-weight:800!important;font-size:13px!important}
    .total-m0-muted{color:var(--muted)!important;font-size:12px!important}

    /* ── MODAL DRILL-DOWN ── */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
    .modal{background:#fff;border-radius:var(--radius);box-shadow:0 20px 60px rgba(0,0,0,.2);width:100%;max-width:680px;max-height:85vh;display:flex;flex-direction:column}
    .modal-head{padding:18px 22px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;flex-shrink:0}
    .modal-head h3{margin:0;font-size:16px;font-weight:800}
    .modal-head .mh-sub{font-size:12px;color:var(--muted);margin-top:2px}
    .modal-close{border:none;background:none;font-size:20px;cursor:pointer;color:var(--muted);line-height:1;padding:4px 6px}
    .modal-close:hover{color:var(--text)}
    .modal-body{overflow-y:auto;padding:0}
    .modal-body table{width:100%;border-collapse:separate;border-spacing:0}
    .modal-body thead th{background:#fafafa;font-size:11px;font-weight:700;color:var(--muted);text-align:left;padding:9px 16px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
    .modal-body thead th.r{text-align:right}
    .modal-body tbody td{padding:9px 16px;border-bottom:1px solid var(--line);font-size:12px}
    .modal-body tbody td.r{text-align:right}
    .modal-body tbody tr:last-child td{border-bottom:none}
    .modal-body tbody tr:hover td{background:#fafafa}
    .clickable{cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px}
    .drill-filter{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px;font:inherit;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer}
    .drill-filter:hover{border-color:#aaa;color:var(--text)}
    .drill-filter.active{background:var(--text);color:#fff;border-color:var(--text)}

    /* ── MODELO PAGE ── */
    .modelo-wrap{display:flex;flex-direction:column;gap:20px}
    .modelo-section{padding:20px 24px}
    .modelo-section h2{font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:0 0 16px}
    .modelo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
    .modelo-card{border:1px solid var(--line);border-radius:12px;padding:14px 16px}
    .modelo-card .mc-name{font-size:13px;font-weight:800;margin-bottom:10px}
    .modelo-card .mc-row{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px solid #f3f3f3}
    .modelo-card .mc-row:last-child{border-bottom:none}
    .modelo-card .mc-row .label{color:var(--muted)}
    .modelo-card .mc-row .val{font-weight:600}
    .modelo-card .mc-badge{display:inline-block;padding:2px 8px;border-radius:5px;font-size:10px;font-weight:700;margin-top:8px}
    .badge-fp{background:#eff6ff;color:#1d4ed8}
    .badge-mpc{background:#f0fdf4;color:#15803d}
    .extras-block{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
    .extras-block .ex-title{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
  </style>
</head>

<!-- MODAL DRILL-DOWN -->
<div id="drillModal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeDrill()">
  <div class="modal">
    <div class="modal-head">
      <div>
        <h3 id="drillTitle">Cuentas</h3>
        <div class="mh-sub" id="drillSub"></div>
      </div>
      <button class="modal-close" onclick="closeDrill()">×</button>
    </div>
    <div class="modal-body" id="drillBody"></div>
  </div>
</div>

<div class="wrap">
  <div style="display:flex;align-items:baseline;gap:12px;margin-bottom:4px">
    <h1>Comisiones Fudo</h1>
  </div>

  <!-- TOP NAV: páginas -->
  <div class="topnav">
    <button class="topnav-page active" data-page="calc">Vista general</button>
    <div class="topnav-sep"></div>
    <button class="topnav-page" data-page="cartas">Comunicación</button>
    <div class="topnav-sep"></div>
    <button class="topnav-page" data-page="modelo">Modelo</button>
  </div>

  <!-- ══ PÁGINA CALCULADORA ══ -->
  <div id="page-calc">
    <div class="card controls" style="display:none">
      <div class="ctrl wide"><label>Archivo Excel</label><input id="fileInput" type="file" accept=".xlsx,.xlsm"/></div>
      <div class="ctrl"><label>Mes</label><select id="monthSelect"></select></div>
      <div class="ctrl"><label>Año</label><select id="yearSelect"></select></div>
      <button class="btn-primary" id="calcBtn">Calcular</button>
    </div>
    <div class="status" id="status">Datos: Febrero 2026</div>

    <!-- TEAM TABS -->
    <div class="team-tabs" id="teamTabs"></div>

    <!-- FILTER -->
    <div class="filter-row">
      <div class="ctrl"><label>Filtrar ejecutivo</label><input id="nameFilter" placeholder="Nombre..." type="text"/></div>
      <div class="status" id="teamStatus"></div>
    </div>

    <!-- SUMMARY -->
    <div class="summary">
      <div class="card stat"><div class="k">Ejecutivos</div><div class="v" id="sExecs">—</div></div>
      <div class="card stat"><div class="k">Ventas SaaS</div><div class="v" id="sSales">—</div></div>
      <div class="card stat"><div class="k">Revenue</div><div class="v" id="sRevenue">—</div></div>
      <div class="card stat"><div class="k">Comisión total</div><div class="v" id="sTotal">—</div></div>
    </div>

    <div class="card tableWrap" id="tableWrap">
      <div class="empty">Calculá para ver resultados.</div>
    </div>
    <div class="footer" id="footer"></div>
  </div>

  <!-- ══ PÁGINA MODELO ══ -->
  <div id="page-modelo" style="display:none">
    <div class="modelo-wrap" id="modeloContent"></div>
  </div>

  <!-- ══ PÁGINA CARTAS ══ -->
  <div id="page-cartas" style="display:none">
    <div class="team-tabs" id="cartasTabs"></div>
    <div id="cartasGrid"></div>
  </div>
</div>

const WEEKLY_BR={

};
function weekOfSat(dateStr){
  // Devuelve fecha del sábado que inicia la semana (formato "DD/MM")
  const[d,m,y]=dateStr.split('/').map(Number);
  const dt=new Date(y,m-1,d);
  const dow=dt.getDay(); // 0=Dom…6=Sáb
  const daysSinceSat=(dow+1)%7; // Sáb=0,Dom=1,Lun=2…Vie=6
  const sat=new Date(dt);
  sat.setDate(dt.getDate()-daysSinceSat);
  return sat.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'});
}
function weekPeriod(wkStr){
  // Devuelve "DD/MM – DD/MM" (sábado a viernes) desde un string "DD/MM"
  const[d,m]=wkStr.split('/').map(Number);
  const y=(typeof EMBEDDED_DATA!=='undefined')?EMBEDDED_DATA.anio:new Date().getFullYear();
  const sat=new Date(y,m-1,d);
  const fri=new Date(sat);fri.setDate(sat.getDate()+6);
  const p=n=>String(n).padStart(2,'0');
  return `${p(sat.getDate())}/${p(sat.getMonth()+1)} – ${p(fri.getDate())}/${p(fri.getMonth()+1)}`;
}
function calcWeeklyBR(accounts,cat){
  const wm=WEEKLY_BR[cat];if(!wm)return{com:0,details:[]};
  // Reporting month (1-indexed). EMBEDDED_DATA.mes is 0-indexed (1=Febrero).
  const anio=(typeof EMBEDDED_DATA!=='undefined')?EMBEDDED_DATA.anio:new Date().getFullYear();
  const mes=(typeof EMBEDDED_DATA!=='undefined')?EMBEDDED_DATA.mes+1:2;
  const weekCounts={};
  accounts.forEach(a=>{
    const wk=weekOfSat(a.fecha);
    // Excluir semanas cuyo viernes (sáb+6) cae en el mes siguiente — pertenecen al próximo período
    const[sd,sm]=wk.split('/').map(Number);
    const sat=new Date(anio,sm-1,sd);
    const fri=new Date(sat);fri.setDate(sat.getDate()+6);
    if(fri.getMonth()+1!==mes)return;
    weekCounts[wk]=(weekCounts[wk]||0)+1;
  });
  let com=0;const details=[];
  // Ordenar por fecha real oldest→newest (sort de string falla en cruce de mes)
  Object.entries(weekCounts)
    .sort(([a],[b])=>{
      const[ad,am]=a.split('/').map(Number);
      const[bd,bm]=b.split('/').map(Number);
      return new Date(anio,am-1,ad)-new Date(anio,bm-1,bd);
    })
    .forEach(([wk,cnt])=>{
      const lvl=levelFrom(cnt,wm.umb);
      const bonus=lvl>0?wm.com[lvl-1]*cnt:0; // por cuenta × com. unitaria
      com+=bonus;
      details.push({wk,cnt,lvl,bonus});
    });
  return{com,details};
}

// ── UTILS ─────────────────────────────────────────────────────────────────────
function norm(s){return String(s??'').trim().replace(/\s+/g,' ').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();}
function n(v){return typeof v==='number'?v:Number(String(v??'').replace(/[^0-9,.-]/g,'').replace(/\.(?=.*\.)/g,'').replace(',','.'))||0;}
function fmt(v){if(v==null||v===0||v==='')return '—';const d=Math.abs(v)%1===0?0:2;return new Intl.NumberFormat('es-AR',{maximumFractionDigits:d,minimumFractionDigits:0}).format(v);}
function fmtPct(v){return v!=null&&v!==0?Math.round(v*100)+'%':'—';}
function excelSerial(y,m,d){return(Date.UTC(y,m,d)-Date.UTC(1899,11,30))/86400000;}
function monthRange(y,m){return{start:excelSerial(y,m,1),end:excelSerial(y,m+1,1)};}
function cellV(sh,r,c){const cell=sh[XLSX.utils.encode_cell({r,c})];return cell?cell.v:undefined;}
function resolveName(raw){const k=norm(raw);return NAME_ALIASES[k]||raw;}
function levelFrom(val,umb){if(!umb||!umb.length)return 0;let l=0;for(let i=0;i<umb.length;i++)if(val>=umb[i])l=i+1;return l;}
function unitCom(model,lvl){if(lvl<=0)return model.noAlcanza||0;return model.com[Math.min(lvl,model.com.length)-1]||0;}
function goalPill(obj){const t=obj>0?`Obj ${obj}`:'No alcanza';return `<span class="pill g${Math.min(obj,4)}">${t}</span>`;}
function pctBar(v){const p=Math.round(Math.min(v||0,1)*100);return `<span class="pct-wrap">${fmtPct(v)}<span class="pct-bar"><span class="pct-fill" style="width:${p}%"></span></span></span>`;}
function th(label,r){return `<th${r?' class="r"':''}>${label}</th>`;}

function getRevU(pais,umbV){
  const arpu=ARPU[pais];
  if(!arpu||!umbV||!umbV.length)return null;
  return umbV.map(u=>u*arpu);
}

function eachRow(sh,fn){
  if(!sh||!sh['!ref'])return;
  const rng=XLSX.utils.decode_range(sh['!ref']);
  for(let r=rng.s.r+1;r<=rng.e.r;r++)fn(r,rng);
}

// ── PARSERS ───────────────────────────────────────────────────────────────────
function parseHS(sh,y,m){
  const {start,end}=monthRange(y,m);
  const counts={},revenues={},liteCounts={},freqMap={},details={};
  eachRow(sh,(r)=>{
    const ownerRaw=cellV(sh,r,1);
    const serial=Number(cellV(sh,r,5));
    if(!ownerRaw||!Number.isFinite(serial))return;
    if(serial<start||serial>=end)return;
    const owner=resolveName(String(ownerRaw).trim());
    const rev=n(cellV(sh,r,47));
    const planRaw=String(cellV(sh,r,22)??'').trim();
    const promoRaw=String(cellV(sh,r,12)??'').trim();
    const freqRaw=norm(String(cellV(sh,r,21)??'').trim());
    const isLite=promoRaw.toLowerCase().includes('lite')&&planRaw==='Inicial';
    // nombre restaurante: col A (índice 0)
    const restName=String(cellV(sh,r,0)??'').trim();
    // fecha: convertir serial a fecha legible
    const fechaDate=new Date(Math.round((serial-25569)*86400*1000));
    const fecha=fechaDate.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'});
    counts[owner]=(counts[owner]||0)+1;
    revenues[owner]=(revenues[owner]||0)+rev;
    if(isLite) liteCounts[owner]=(liteCounts[owner]||0)+1;
    if(!freqMap[owner])freqMap[owner]=[];
    freqMap[owner].push(freqRaw);
    const codigoPromo=String(cellV(sh,r,3)??'').trim();
    const frecuencia=String(cellV(sh,r,21)??'').trim();
    const detallePromo=String(cellV(sh,r,12)??'').trim();
    if(!details[owner])details[owner]=[];
    details[owner].push({name:restName||'—',fecha,plan:planRaw||'—',rev,codigoPromo,frecuencia,detallePromo});
  });
  return{counts,revenues,liteCounts,freqMap,details,range:{start,end}};
}

function parseFP(sh,ownerCol,activeCol,filterActive,nameCol,dateTermCol,dateSaaSCol){
  const counts={},details={};
  eachRow(sh,(r)=>{
    const ownerRaw=cellV(sh,r,ownerCol);
    if(!ownerRaw)return;
    const owner=resolveName(String(ownerRaw).trim());
    if(filterActive){
      if(norm(String(cellV(sh,r,activeCol)??''))!=='si')return;
    }
    counts[owner]=(counts[owner]||0)+1;
    if(nameCol!=null){
      const restName=String(cellV(sh,r,nameCol)??'').trim()||'—';
      function fmtDate(v){
        if(!v)return '—';
        if(v instanceof Date||typeof v==='object')return new Date(v).toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'});
        if(typeof v==='number'&&v>40000)return new Date(Math.round((v-25569)*86400*1000)).toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'});
        return '—';
      }
      const fechaTerm=fmtDate(cellV(sh,r,dateTermCol));
      const fechaSaaS=dateSaaSCol!=null?fmtDate(cellV(sh,r,dateSaaSCol)):'—';
      if(!details[owner])details[owner]=[];
      details[owner].push({name:restName,fechaTerm,fechaSaaS});
    }
  });
  return{counts,details};
}

function parseTO(sh){
  const counts={};
  eachRow(sh,(r)=>{
    const ownerRaw=cellV(sh,r,1);
    const qty=n(cellV(sh,r,2));
    if(!ownerRaw)return;
    const owner=resolveName(String(ownerRaw).trim());
    counts[owner]=(counts[owner]||0)+qty;
  });
  return counts;
}

function parseHSFreq(sh){
  const freq={};
  if(!sh||!sh['!ref'])return freq;
  eachRow(sh,(r)=>{
    const owner=String(cellV(sh,r,1)??'').trim();
    const f=String(cellV(sh,r,8)??'').trim().toLowerCase(); // col I = Frecuencia
    if(!owner)return;
    const key=resolveName(owner);
    if(!freq[key])freq[key]={anuales:0,semestrales:0};
    if(f==='yearly')freq[key].anuales++;
    else if(f==='biannually')freq[key].semestrales++;
  });
  return freq;
}
function parseUber(sh,monthNum){
  const counts={};
  if(!sh||!sh['!ref'])return counts;
  const rng=XLSX.utils.decode_range(sh['!ref']);
  // Leer desde la tabla resumen: buscar fila con "Ejecutivo Uber" en col A
  let headerRow=-1;
  for(let r=rng.s.r;r<=rng.e.r;r++){
    const v=String(cellV(sh,r,0)??'').trim();
    if(v==='Ejecutivo Uber'){headerRow=r;break;}
  }
  if(headerRow>=0){
    for(let r=headerRow+1;r<=rng.e.r;r++){
      const name=String(cellV(sh,r,0)??'').trim();
      const cnt=n(cellV(sh,r,1));
      if(!name)break;
      if(cnt>0) counts[resolveName(name)]=(counts[resolveName(name)]||0)+cnt;
    }
    return counts;
  }
  // Fallback: conteo por filas individuales
  eachRow(sh,(r)=>{
    const seller=String(cellV(sh,r,4)??'').trim();
    const stage=norm(String(cellV(sh,r,7)??''));
    const done=n(cellV(sh,r,rng.e.c));
    if(seller&&stage==='completed'&&done===monthNum){
      counts[resolveName(seller)]=(counts[resolveName(seller)]||0)+1;
    }
  });
  return counts;
}

function calcTOIn(pais,qty){
  const m=MODEL.TO_Inbound[pais];
  if(!m||qty<=0)return{lvl:0,comUnit:0,com:0};
  if(m.flatPer)return{lvl:1,comUnit:m.flatPer,com:m.flatPer*qty};
  const lvl=levelFrom(qty,m.umb);
  const comUnit=lvl<=0?m.noAlcanza:(m.com[Math.min(lvl,m.com.length)-1]||0);
  return{lvl,comUnit,com:comUnit*qty};
}

function calcTOOutAR(qty,anuales,semestrales){
  anuales=anuales||0; semestrales=semestrales||0;
  const com=(qty||0)*TO_OUT_AR.mensual + anuales*TO_OUT_AR.anual + semestrales*TO_OUT_AR.semestral;
  return{anuales,semestrales,com};
}

// ── BUILD RESULTS ─────────────────────────────────────────────────────────────
function buildResults(parsed){
  const results=[];
  for(const[name,meta]of Object.entries(EXECS)){
    const flow=meta.flow;
    const model=MODEL[flow]?.[meta.pais]?.[meta.cat];
    if(!model)continue;
    const saas=parsed.hs.counts[name]||0;
    const rev=parsed.hs.revenues[name]||0;
    const uber=parsed.uber[name]||0;
    const fp=(flow==='Outbound'?parsed.fpOut[name]:parsed.fpIn[name])||0;
    const toQty=flow==='Inbound'?(parsed.to[name]||0):0;
    const toQtyOut=flow==='Outbound'&&meta.pais==='Argentina'
      ?((typeof EMBEDDED_DATA!=='undefined'&&EMBEDDED_DATA.toOut&&EMBEDDED_DATA.toOut[name]!=null)
        ?EMBEDDED_DATA.toOut[name]:(parsed.to[name]||0)):0;
    const liteCount=(meta.pais==='México'&&flow==='Inbound')?(parsed.hs.liteCounts[name]||0):0;
    const normalCount=saas-liteCount;
    const accounts=parsed.details?.[name]||[];
    const fpDetails=(flow==='Outbound'?parsed.fpOutDetails:parsed.fpInDetails)?.[name]||[];

    const driver=model.umbFP?fp:(saas+uber);
    const umbUsed=model.umbFP||model.umbV;
    const objetivo=levelFrom(driver,umbUsed);
    const obj1Ref=umbUsed?umbUsed[0]:null;
    const comUnit=unitCom(model,objetivo);

    let comSaaS=0;
    if(saas+uber>0){
      if(meta.pais==='México'&&flow==='Inbound'){
        comSaaS=(normalCount+uber)*comUnit+liteCount*(comUnit*0.5);
      } else {
        comSaaS=comUnit*(saas+uber);
      }
    }

    const revU=getRevU(meta.pais,model.umbV);
    const hasRev=flow==='Inbound'&&meta.pais!=='Chile'&&!!revU;
    const revLvl=hasRev?levelFrom(rev,revU):0;
    const revNext=hasRev&&revLvl<revU.length?revU[revLvl]:revU?.[revU.length-1];
    const revPct=hasRev&&revNext?Math.min(rev/revNext,1):0;
    const revForCom=meta.pais==='Colombia'?rev/3700:rev;
    const comRev=hasRev&&revLvl>0?revForCom*(model.rev[revLvl-1]||0):0;

    const toIn=flow==='Inbound'?calcTOIn(meta.pais,toQty):{lvl:0,comUnit:0,com:0};
    const toOut=flow==='Outbound'&&meta.pais==='Argentina'
      ?calcTOOutAR(toQtyOut,(parsed.hsFreq?.[name]?.anuales||0),(parsed.hsFreq?.[name]?.semestrales||0))
      :{anuales:0,semestrales:0,com:0};

    // ── Brasil: bono semanal ──
    const weekly=meta.pais==='Brasil'?calcWeeklyBR(accounts,meta.cat):{com:0,details:[]};

    // ── FP Outbound AR ──
    const fpAR=(flow==='Outbound'&&meta.pais==='Argentina'&&typeof EMBEDDED_DATA!=='undefined'&&EMBEDDED_DATA.fpOutAR)
      ?(EMBEDDED_DATA.fpOutAR[name]??fp):fp;
    const comFP=flow==='Outbound'&&meta.pais==='Argentina'?fpAR*23000:0;

    // ── Tienda Online Chile (programa flat) ──
    const toCLData=(meta.pais==='Chile'&&typeof EMBEDDED_DATA!=='undefined'&&EMBEDDED_DATA.toCL)
      ?EMBEDDED_DATA.toCL[name]:null;
    const toCLCuentas=toCLData?toCLData.cuentas:0;
    const comToCL=toCLCuentas*(flow==='Inbound'?15000:25000);

    // ── Ajuste mes anterior (deuda/crédito) ──
    const ajuste=(typeof EMBEDDED_DATA!=='undefined'&&EMBEDDED_DATA.ajustes)
      ?(EMBEDDED_DATA.ajustes[name]||0):0;

    const total=comSaaS+comRev+toIn.com+toOut.com+weekly.com+comFP+comToCL;
    const totalFinal=total+ajuste;

    results.push({
      name,pais:meta.pais,cat:meta.cat,flow,
      saas,uber,fp:fpAR,toQty,toQtyOut,liteCount,normalCount,rev,
      objetivo,obj1Ref,comUnit,comSaaS,
      hasRev,revLvl,revPct,comRev,revU,
      toInLvl:toIn.lvl,comTOUnit:toIn.comUnit,comTO:toIn.com,
      toAnu:toOut.anuales,toSem:toOut.semestrales,comTOOut:toOut.com,comFP,
      comWeekly:weekly.com,weeklyDetails:weekly.details,
      toCLCuentas,comToCL,
      ajuste,total,totalFinal,
      driverSrc:model.umbFP?'FP':'MPCs',
      accounts,uberAccounts:(parsed.uberDetails?.[name]||[]),fpDetails,
    });
  }
  return results.sort((a,b)=>b.totalFinal-a.totalFinal||a.name.localeCompare(b.name));
}

// ── M2 fila en tabla resumen ──────────────────────────────────────────────────
function m2TableRow(r, numCols){
  const m2=(typeof EMBEDDED_DATA!=='undefined'&&EMBEDDED_DATA.m2)?(EMBEDDED_DATA.m2[r.name]||null):null;
  const ajuste=r.ajuste||0;
  if(!m2&&!ajuste)return '';
  let parts=[];
  let finalTotal=r.totalFinal;
  if(m2){
    const maxDesc=r.total*0.2;
    const descFinal=Math.min(Math.abs(m2.descTotal),maxDesc);
    finalTotal=(r.total-descFinal)+ajuste;
    parts.push(`<span class="badge-m2">M2</span> ${m2.bajas} bajas · Desc: <strong>${fmt(-descFinal)}</strong> <span class="muted">(máx. 20%=${fmt(-maxDesc)})</span>`);
  }
  if(ajuste){
    const sign=ajuste>0?'+':'';
    parts.push(`<span style="color:#0369a1">Ajuste mes ant.: <strong>${sign}${fmt(ajuste)}</strong></span>`);
  }
  return `<tr class="m2-tr">
    <td colspan="${numCols-1}"><div class="m2-tr-label">${parts.join('<span class="m2-tr-sep"> · </span>')}</div></td>
    <td class="r m2-tr-total">${fmt(finalTotal)}</td>
  </tr>`;
}

  if(!rows.length)return '<div class="empty">Sin datos para este equipo.</div>';

  if(key==='AR_IN'){

    tbody=rows.map(r=>`<tr>
      <td><div class="name">${r.name}</div></td>
      <td><span class="pill">${r.cat}</span></td>
      <td class="r"><span class="clickable" onclick="openDrill('${r.name}','mpc')">${fmt(r.saas+r.uber)}</span></td>
      <td class="r muted">${fmt(r.obj1Ref)}</td>
      <td>${goalPill(r.objetivo)}</td>
      <td class="r">${fmt(r.comUnit)}</td>

// ── DRILL-DOWN MODAL ──────────────────────────────────────────────────────────
function openDrill(name, type){
  const r=state.results.find(x=>x.name===name);
  if(!r)return;
  const isFP = type==='fp';
  const isUber = type==='uber';
  const saasAccounts = r.accounts || [];
  const uberAccounts = (r.uberAccounts||[]).map(u=>({
    name: u.name, fecha:'—', plan: u.tipo, frecuencia:'—', codigoPromo:'—', detallePromo:'—', rev:0, isUber:true
  }));
  const list = isFP ? r.fpDetails : (isUber ? uberAccounts : [...saasAccounts, ...uberAccounts]);
  if(!list||!list.length){
    alert(`Sin datos de ${isFP?'FP':'MPCs'} para ${name}`);
    return;
  }
  document.getElementById('drillTitle').textContent=name;
  document.getElementById('drillSub').textContent=`${list.length} cuenta${list.length!==1?'s':''} · ${isFP?'Fudo Pagos':'SaaS'} · ${r.pais} ${r.flow}`;

  function renderDrillTable(filterPlan){
    const filtered = filterPlan ? list.filter(a=>a.plan===filterPlan) : list;
    let rows;
    if(isFP){
      rows=filtered.map(a=>`<tr><td>${a.name}</td><td>${a.fechaTerm}</td><td>${a.fechaSaaS}</td></tr>`).join('');
      return `<table><thead><tr><th>Restaurante</th><th>Fecha pago terminal</th><th>Fecha pago SaaS</th></tr></thead><tbody>${rows}</tbody></table>`;
    } else {
      rows=filtered.map(a=>`<tr style="${a.isUber?'background:rgba(0,160,80,0.06)':''}">
        <td>${a.name}${a.isUber?` <span style="font-size:10px;background:#e8f5e9;color:#2e7d32;padding:1px 5px;border-radius:3px;margin-left:4px">${a.plan}</span>`:''}</td>
        <td>${a.isUber?'—':a.fecha}</td>
        <td>${a.isUber?'—':a.plan}</td>
        <td>${a.isUber?'—':(a.frecuencia&&a.frecuencia!=='(Sin valor)'?a.frecuencia:'—')}</td>
        <td>${a.isUber?'—':(a.codigoPromo&&a.codigoPromo!=='(Sin valor)'?a.codigoPromo:'—')}</td>
        <td style="max-width:200px;white-space:normal;font-size:11px">${a.isUber?'—':(a.detallePromo&&a.detallePromo!=='(Sin valor)'?a.detallePromo:'—')}</td>
        <td class="r">${a.isUber?'—':(a.rev>0?fmt(a.rev):'—')}</td>
      </tr>`).join('');
      return `<table><thead><tr><th>Restaurante</th><th>Fecha cierre</th><th>Plan</th><th>Frecuencia</th><th>Cód. promo</th><th>Detalle promos</th><th class="r">Revenue</th></tr></thead><tbody>${rows}</tbody></table>`;
    }
  }

  // Filtro por plan (solo para MPCs)
  let filterBar = '';
  if(!isFP){
    const planes=[...new Set(list.map(a=>a.plan).filter(Boolean))].sort();
    filterBar=`<div style="padding:10px 16px;border-bottom:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap;align-items:center">
      <span style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px">Plan:</span>
      <button class="drill-filter active" data-plan="" onclick="applyDrillFilter(this,'${name}','${type}')">Todos (${list.length})</button>
      ${planes.map(p=>{const c=list.filter(a=>a.plan===p).length;return`<button class="drill-filter" data-plan="${p}" onclick="applyDrillFilter(this,'${name}','${type}')">${p} (${c})</button>`;}).join('')}
    </div>`;
  }

  document.getElementById('drillBody').innerHTML = filterBar + `<div id="drillTable">${renderDrillTable('')}</div>`;
  document.getElementById('drillModal').style.display='flex';

  // Guardar estado para re-render
  window._drillState = {name, type, renderFn: renderDrillTable};
}

function applyDrillFilter(btn, name, type){
  document.querySelectorAll('.drill-filter').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const plan = btn.dataset.plan;
  document.getElementById('drillTable').innerHTML = window._drillState.renderFn(plan);
}
function closeDrill(){
  document.getElementById('drillModal').style.display='none';
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrill();});

// ── MODELO PAGE ───────────────────────────────────────────────────────────────
function renderModelo(){
  const container=document.getElementById('modeloContent');
  const sections=[];
  function fmtM(v){return v!=null?new Intl.NumberFormat('es-AR',{maximumFractionDigits:0}).format(v):'';}
  function pctStr(v){return v!=null?(v*100)+'%':'';}

  TEAMS.forEach(team=>{
    // Agrupar ejecutivos de este equipo por categoría
    const teamExecs=Object.entries(EXECS).filter(([,m])=>team.filter({pais:m.pais,flow:m.flow}));
    if(!teamExecs.length)return;

    // Obtener categorías únicas en orden
    const catMap={};
    teamExecs.forEach(([name,meta])=>{
      if(!catMap[meta.cat])catMap[meta.cat]={meta,names:[]};
      catMap[meta.cat].names.push(name);
    });

    const cards=Object.entries(catMap).map(([cat,{meta,names}])=>{
      const flow=meta.flow;
      const m=MODEL[flow]?.[meta.pais]?.[cat];
      if(!m)return '';
      const usesFP=!!m.umbFP;
      const umb=m.umbFP||m.umbV||[];
      const revU=getRevU(meta.pais,m.umbV);
      const driverBadge=usesFP
        ?'<span class="mc-badge badge-fp">Driver: FP</span>'
        :'<span class="mc-badge badge-mpc">Driver: MPCs</span>';

      let rows=`<div class="mc-row"><span class="label">No alcanza</span><span class="val">${fmtM(m.noAlcanza)}</span></div>`;
      m.com.forEach((c,i)=>{
        rows+=`<div class="mc-row"><span class="label">Obj ${i+1} (≥${umb[i]} ${usesFP?'FP':'MPCs'})</span><span class="val">${fmtM(c)}/cuenta</span></div>`;
      });

      let extras='';
      // Revenue dinámico
      if(revU&&m.rev){
        extras+=`<div class="extras-block"><div class="ex-title">Revenue</div>`;
        m.rev.forEach((r,i)=>{extras+=`<div class="mc-row"><span class="label">Obj ${i+1} (≥${fmtM(revU[i])})</span><span class="val">${pctStr(r)} del MRR</span></div>`;});
        extras+=`</div>`;
      }
      // TO Inbound
      const toM=MODEL.TO_Inbound?.[meta.pais];
      if(flow==='Inbound'&&toM){
        extras+=`<div class="extras-block"><div class="ex-title">Tienda Online</div>`;
        if(toM.flatPer){
          extras+=`<div class="mc-row"><span class="label">Por cuenta</span><span class="val">${fmtM(toM.flatPer)}</span></div>`;
        } else {
          extras+=`<div class="mc-row"><span class="label">No alcanza</span><span class="val">${fmtM(toM.noAlcanza)}</span></div>`;
          toM.com.forEach((c,i)=>{extras+=`<div class="mc-row"><span class="label">Obj ${i+1} (≥${toM.umb[i]})</span><span class="val">${fmtM(c)}/cuenta</span></div>`;});
        }
        extras+=`</div>`;
      }
      // TO Outbound AR
      if(flow==='Outbound'&&meta.pais==='Argentina'){
        extras+=`<div class="extras-block"><div class="ex-title">Tienda Online</div>
          <div class="mc-row"><span class="label">Por cuenta</span><span class="val">${fmtM(TO_OUT_AR.mensual)}</span></div>
        </div>`;
      }

      // Lista de ejecutivos de esta categoría
      const execList=names.map(n=>`<span style="display:inline-block;background:#f3f4f6;border-radius:6px;padding:2px 8px;font-size:11px;margin:2px 2px 0 0">${n}</span>`).join('');

      return `<div class="modelo-card">
        <div class="mc-name">${cat} <span style="font-weight:400;color:var(--muted);font-size:11px">${flow}</span></div>
        ${driverBadge}
        <div style="margin-top:10px">${rows}</div>
        ${extras}
        <div style="margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)">
          <div class="ex-title" style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">Ejecutivos</div>
          ${execList}
        </div>
      </div>`;
    }).join('');

    sections.push(`<div class="card modelo-section">
      <h2>${team.label}</h2>
      <div class="modelo-grid">${cards}</div>
    </div>`);
  });

  container.innerHTML=sections.join('');
}

// ── CARTAS ────────────────────────────────────────────────────────────────────
function buildCarta(r, mes, anio){
  const mesLabel = MONTHS[mes] + ' ' + anio;
  const m2 = (typeof EMBEDDED_DATA !== 'undefined' && EMBEDDED_DATA.m2) ? (EMBEDDED_DATA.m2[r.name] || null) : null;

  function row(label, sub, val, green){
    return `<div class="carta-row">
      <div><div class="cr-label">${label}</div>${sub?`<div class="cr-sub">${sub}</div>`:''}
      </div>
      <div class="cr-val${green?' ok':''}">${val}</div>
    </div>`;
  }

  let sections = '';

  // ── Ventas SaaS ──
  let saasRows = '';
  if(r.pais === 'Chile' && r.flow === 'Inbound'){
    saasRows += row('Ventas FP', null, fmt(r.fp));
    saasRows += row('Objetivo alcanzado', null, r.objetivo > 0 ? `Obj ${r.objetivo}` : 'No alcanza');
    saasRows += row('Comisión unitaria', null, fmt(r.comUnit));
    saasRows += row('MPCs', null, fmt(r.saas + r.uber));
    saasRows += row('Total ventas', null, fmt(r.comSaaS), true);
  } else if(r.pais === 'México' && r.flow === 'Inbound'){
    saasRows += row('MPCs totales', null, fmt(r.saas + r.uber));
    if(r.liteCount > 0){
      saasRows += row('  Plan Lite', `${r.liteCount} cuentas × ${fmt(r.comUnit * 0.5)}`, fmt(r.liteCount * r.comUnit * 0.5));
      saasRows += row('  Plan Normal', `${r.normalCount} cuentas × ${fmt(r.comUnit)}`, fmt(r.normalCount * r.comUnit));
    } else {
      saasRows += row('Comisión unitaria', null, fmt(r.comUnit));
    }
    saasRows += row('Objetivo alcanzado', null, r.objetivo > 0 ? `Obj ${r.objetivo}` : 'No alcanza');
    saasRows += row('Total ventas', null, fmt(r.comSaaS), true);
  } else if(r.flow === 'Outbound' && r.pais === 'Chile'){
    saasRows += row('Ventas FP', null, fmt(r.fp));
    saasRows += row('Objetivo alcanzado', null, r.objetivo > 0 ? `Obj ${r.objetivo}` : 'No alcanza');
    saasRows += row('Comisión unitaria', null, fmt(r.comUnit));
    saasRows += row('MPCs', null, fmt(r.saas + r.uber));
    saasRows += row('Total ventas', null, fmt(r.comSaaS), true);
  } else {
    saasRows += row('MPCs', null, fmt(r.saas + r.uber));
    saasRows += row('Objetivo alcanzado', `Obj 1 = ${fmt(r.obj1Ref)} MPCs`, r.objetivo > 0 ? `Obj ${r.objetivo}` : 'No alcanza');
    saasRows += row('Comisión unitaria', null, fmt(r.comUnit));
    saasRows += row('Total ventas', null, fmt(r.comSaaS), true);
  }
  sections += `<div class="carta-section"><div class="carta-section-title">Ventas</div>${saasRows}</div>`;

  // ── Revenue ──
  if(r.hasRev && r.rev > 0){
    let revRows = '';
    if(r.pais === 'Colombia'){
      const revUSD = r.rev / 3700;
      revRows += row('MRR generado (COP)', null, fmt(r.rev));
      revRows += row('MRR en USD (÷3700)', null, fmt(revUSD));
    } else {
      revRows += row('MRR generado', null, fmt(r.rev));
    }
    revRows += row('Objetivo revenue', null, r.revLvl > 0 ? `Obj ${r.revLvl}` : 'No alcanza');
    if(r.revLvl > 0){
      const pct = MODEL.Inbound[r.pais][r.cat].rev[r.revLvl - 1];
      revRows += row('% aplicado', null, Math.round(pct * 100) + '%');
      revRows += row('Total revenue', null, fmt(r.comRev), true);
    }
    sections += `<div class="carta-section"><div class="carta-section-title">Revenue</div>${revRows}</div>`;
  }

  // ── TO Inbound ──
  if(r.flow === 'Inbound' && r.toQty > 0){
    let toRows = '';
    toRows += row('Cuentas TO', null, fmt(r.toQty));
    toRows += row('Comisión unitaria TO', null, fmt(r.comTOUnit));
    toRows += row('Total TO', null, fmt(r.comTO), true);
    sections += `<div class="carta-section"><div class="carta-section-title">Tienda Online</div>${toRows}</div>`;
  }

  // ── TO Outbound AR ──
  if(r.flow === 'Outbound' && r.pais === 'Argentina' && r.toQtyOut > 0){
    let toRows = '';
    toRows += row('Cuentas TO', null, fmt(r.toQtyOut));
    toRows += row('Comisión unitaria TO', null, fmt(TO_OUT_AR.mensual));
    toRows += row('Total TO', null, fmt(r.comTOOut), true);
    sections += `<div class="carta-section"><div class="carta-section-title">Tienda Online</div>${toRows}</div>`;
  }

  // ── Tienda Online Chile (programa flat) ──
  if(r.pais === 'Chile' && r.comToCL > 0){
    let toCLRows = '';
    toCLRows += row('Cuentas', null, fmt(r.toCLCuentas));
    toCLRows += row('Comisión x cuenta', null, fmt(r.flow==='Inbound'?15000:25000));
    toCLRows += row('Total', null, fmt(r.comToCL), true);
    sections += `<div class="carta-section"><div class="carta-section-title">Tienda Online</div>${toCLRows}</div>`;
  }

  // ── Bono semanal Brasil ──
  if(r.pais === 'Brasil' && r.weeklyDetails && r.weeklyDetails.length > 0){
    let wRows = '';
    r.weeklyDetails.forEach(w => {
      wRows += row(`Semana ${w.wk}`, `${w.cnt} venta${w.cnt!==1?'s':''} → ${w.lvl>0?'Obj '+w.lvl:'No alcanza'}`, w.bonus>0?fmt(w.bonus):'—', w.bonus>0);
    });
    wRows += row('Total bono semanal', null, fmt(r.comWeekly), true);
    sections += `<div class="carta-section"><div class="carta-section-title">Bono semanal</div>${wRows}</div>`;
  }

  // ── Bloque M2 + ajuste ──
  const ajuste = r.ajuste || 0;
  let m2Section = '';
  let totalSection;

  if(m2){
    const maxDesc = r.total * 0.2;
    const descFinal = Math.min(Math.abs(m2.descTotal), maxDesc);
    const finalTotal = r.total - descFinal + ajuste;
    m2Section = `<div class="carta-section">
      <div class="carta-section-title">Retención M2</div>
      ${row('Clientes M2', null, fmt(m2.clientes))}
      ${row('Bajas', null, fmt(-m2.bajas))}
      <div class="m2-sep"></div>
      ${m2.descRev !== 0 ? row('Desc. revenue', null, fmt(m2.descRev)) : ''}
      ${row('Desc. ventas', null, fmt(m2.descVentas))}
      ${row('Desc. M2 total', null, fmt(m2.descTotal))}
      <div class="m2-sep"></div>
      ${row('Máx. desc. (20%)', null, fmt(-maxDesc))}
      ${row('Descuento final', null, fmt(-descFinal))}
      ${ajuste ? row('Ajuste mes anterior', null, (ajuste>0?'+':'')+fmt(ajuste)) : ''}
      <div class="m2-final">
        <span class="m2-final-label">Con retención M2</span>
        <span class="m2-final-val">${fmt(finalTotal)}</span>
      </div>
    </div>`;
    totalSection = `<div class="carta-total m2-muted">
      <div class="ct-label">Total M0</div>
      <div class="ct-val">${fmt(r.total)}</div>
    </div>`;
  } else if(ajuste){
    totalSection = `<div class="carta-total m2-muted">
      <div class="ct-label">Total M0</div>
      <div class="ct-val">${fmt(r.total)}</div>
    </div>
    <div class="carta-total" style="border-top:none;padding-top:2px">
      <div class="ct-label" style="color:#0369a1">Ajuste mes anterior</div>
      <div class="ct-val" style="color:#0369a1">${ajuste>0?'+':''}${fmt(ajuste)}</div>
    </div>
    <div class="carta-total" style="border-top:1px solid var(--border);padding-top:8px;margin-top:4px">
      <div class="ct-label">Total a pagar</div>
      <div class="ct-val">${fmt(r.totalFinal)}</div>
    </div>`;
  } else {
    totalSection = `<div class="carta-total">
      <div class="ct-label">Total a pagar</div>
      <div class="ct-val">${fmt(r.total)}</div>
    </div>`;
  }

  return `<div class="carta">
    <div class="carta-header">
      <div class="carta-nombre">${r.name}${m2 ? '<span class="badge-m2">M2</span>' : ''}</div>
      <div class="carta-meta">${r.pais} · ${r.flow} · ${mesLabel}</div>
    </div>
    ${sections}
    ${m2Section}
    ${totalSection}
  </div>`;
}

function renderCartas(){
  const mes = Number(document.getElementById('monthSelect').value);
  const anio = Number(document.getElementById('yearSelect').value);

  // Update tabs
  document.querySelectorAll('#cartasTabs .team-tab').forEach(b =>
    b.classList.toggle('active', b.dataset.key === state.activeCartasTeam)
  );

  const team = TEAMS.find(t => t.key === state.activeCartasTeam);
  const rows = state.results.filter(team.filter);
  if(!rows.length){
    document.getElementById('cartasGrid').innerHTML = '<div class="empty">Calculá primero para ver las cartas.</div>';
    return;
  }
  document.getElementById('cartasGrid').innerHTML =
    `<div class="cartas-grid">${rows.map(r => buildCarta(r, mes, anio)).join('')}</div>`;
}

// ── STATE & NAVIGATION ────────────────────────────────────────────────────────
const state={wb:null,results:[],activeTeam:TEAMS[0].key,activeCartasTeam:TEAMS[0].key};

// Page nav
document.querySelectorAll('.topnav-page').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.topnav-page').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const page=btn.dataset.page;
    document.getElementById('page-calc').style.display=page==='calc'?'':'none';
    document.getElementById('page-modelo').style.display=page==='modelo'?'':'none';
    document.getElementById('page-cartas').style.display=page==='cartas'?'':'none';
    if(page==='modelo') renderModelo();
    if(page==='cartas') renderCartas();
  });
});

// Build team tabs (calculadora)
function buildTeamTabs(){
  const container=document.getElementById('teamTabs');
  container.innerHTML=TEAMS.map(t=>`<button class="team-tab${t.key===state.activeTeam?' active':''}" data-key="${t.key}">${t.label}</button>`).join('');
  container.querySelectorAll('.team-tab').forEach(btn=>{
    btn.addEventListener('click',()=>{
      state.activeTeam=btn.dataset.key;
      document.getElementById('nameFilter').value='';
      renderTable();
    });
  });
}

// Build team tabs (cartas)
function buildCartasTabs(){
  const container=document.getElementById('cartasTabs');
  container.innerHTML=TEAMS.map(t=>`<button class="team-tab${t.key===state.activeCartasTeam?' active':''}" data-key="${t.key}">${t.label}</button>`).join('');
  container.querySelectorAll('.team-tab').forEach(btn=>{
    btn.addEventListener('click',()=>{
      state.activeCartasTeam=btn.dataset.key;
      renderCartas();
    });
  });
}

function renderTable(){
  // Update tab highlights first
  document.querySelectorAll('.team-tab').forEach(b=>b.classList.toggle('active',b.dataset.key===state.activeTeam));
  const team=TEAMS.find(t=>t.key===state.activeTeam);
  const nameQ=norm(document.getElementById('nameFilter').value);
  let rows=state.results.filter(team.filter);
  if(nameQ) rows=rows.filter(r=>norm(r.name).includes(nameQ));

  // Summary (full team, no name filter)
  const allTeam=state.results.filter(team.filter);
  document.getElementById('sExecs').textContent=allTeam.length;
  document.getElementById('sSales').textContent=fmt(allTeam.reduce((a,b)=>a+b.saas+b.uber,0));
  document.getElementById('sRevenue').textContent=fmt(allTeam.reduce((a,b)=>a+b.rev,0));
  document.getElementById('sTotal').textContent=fmt(allTeam.reduce((a,b)=>a+b.total,0));

  document.getElementById('teamStatus').textContent=nameQ?`Mostrando ${rows.length} de ${allTeam.length} ejecutivos`:'';
  document.getElementById('tableWrap').innerHTML=buildTable(rows,state.activeTeam);
}

// Init
buildTeamTabs();
buildCartasTabs();

for(let i=0;i<12;i++){
  const o=document.createElement('option');o.value=i;o.textContent=MONTHS[i];if(i===1)o.selected=true;
  document.getElementById('monthSelect').appendChild(o);
}
const curY=new Date().getFullYear();
for(let y=curY;y>=curY-1;y--){
  const o=document.createElement('option');o.value=y;o.textContent=y;
  document.getElementById('yearSelect').appendChild(o);
}

document.getElementById('fileInput').addEventListener('change',async e=>{
  const file=e.target.files[0];if(!file)return;
  document.getElementById('status').textContent=`Cargando ${file.name}...`;
  const data=await file.arrayBuffer();
  state.wb=XLSX.read(data,{type:'array',raw:true,cellDates:false,cellNF:true});
  document.getElementById('status').textContent=`✓ ${state.wb.SheetNames.join(' · ')}`;
});

document.getElementById('calcBtn').addEventListener('click',()=>{
  if(!state.wb){alert('Primero subí un archivo Excel.');return;}
  const m=Number(document.getElementById('monthSelect').value);
  const y=Number(document.getElementById('yearSelect').value);
  const hsData=parseHS(state.wb.Sheets['2. Base HS - Mes actual'],y,m);
  const fpInData=parseFP(state.wb.Sheets['Base FP - Mes actual'],1,2,false,0,3,4);
  const fpOutData=parseFP(state.wb.Sheets['Data FP Outbound'],6,7,false,5,10,11);
  const parsed={
    hs:hsData,
    fpIn:fpInData.counts,
    fpOut:fpOutData.counts,
    fpInDetails:fpInData.details,
    fpOutDetails:fpOutData.details,
    to:parseTO(state.wb.Sheets['Tienda Online']),
    uber:parseUber(state.wb.Sheets['Uber Eats - Outbound AR'],m+1),
    hsFreq:parseHSFreq(state.wb.Sheets['2. Base HS - Mes actual']),
    details:hsData.details,
  };
  state.results=buildResults(parsed);
  renderTable();
  // Si la página de cartas está activa, re-renderizar
  if(document.getElementById('page-cartas').style.display !== 'none') renderCartas();
  document.getElementById('status').textContent=`Calculado: ${MONTHS[m]} ${y}`;
  document.getElementById('footer').textContent=`Serial Excel: ${hsData.range.start.toFixed(3)} – ${hsData.range.end.toFixed(3)}`;
});

document.getElementById('nameFilter').addEventListener('input',renderTable);

// ── AUTO-CÁLCULO CON DATOS EMBEBIDOS ────────────────────────────────────────
(function(){
  if(typeof EMBEDDED_DATA === 'undefined') return;
  const d = EMBEDDED_DATA;
  const mes = d.mes;   // 1 = Febrero
  const anio = d.anio; // 2026

  // Seleccionar mes/año en los selects
  document.getElementById('monthSelect').value = mes;
  document.getElementById('yearSelect').value = anio;

  // Construir parsed igual que el calcBtn pero desde los datos embebidos
  const counts={}, revenues={}, liteCounts={}, details={};
  d.hs.forEach(row => {
    const owner = resolveName(row.owner);
    const isLite = row.detallePromo.toLowerCase().includes('lite') && row.plan === 'Inicial';
    counts[owner] = (counts[owner]||0) + 1;
    revenues[owner] = (revenues[owner]||0) + row.rev;
    if(isLite) liteCounts[owner] = (liteCounts[owner]||0) + 1;
    if(!details[owner]) details[owner] = [];
    details[owner].push({
      name: row.neg||'—', fecha: row.fecha, plan: row.plan||'—', rev: row.rev,
      codigoPromo: row.codigoPromo, frecuencia: row.frecuencia, detallePromo: row.detallePromo
    });
  });

  const fpInCounts={}, fpInDetails={};
  d.fpIn.forEach(row => {
    const owner = resolveName(row.owner);
    fpInCounts[owner] = (fpInCounts[owner]||0) + 1;
    if(!fpInDetails[owner]) fpInDetails[owner] = [];
    fpInDetails[owner].push({name: row.neg||'—', fechaTerm: row.fechaTerm, fechaSaaS: row.fechaSaaS});
  });

  const fpOutCounts={}, fpOutDetails={};
  d.fpOut.forEach(row => {
    const owner = resolveName(row.owner);
    fpOutCounts[owner] = (fpOutCounts[owner]||0) + 1;
    if(!fpOutDetails[owner]) fpOutDetails[owner] = [];
    fpOutDetails[owner].push({name: row.neg||'—', fechaTerm: row.fechaTerm, fechaSaaS: row.fechaSaaS});
  });

  const toCounts={};
  d.to.forEach(row => {
    const owner = resolveName(row.owner);
    toCounts[owner] = (toCounts[owner]||0) + row.qty;
  });

  const uberCounts={}, uberDetails={};
  d.uber.forEach(row => {
    const owner = resolveName(row.seller);
    uberCounts[owner] = (uberCounts[owner]||0) + 1;
    if(!uberDetails[owner]) uberDetails[owner]=[];
    uberDetails[owner].push({name: row.neg||'—', tipo: row.tipo||'Uber'});
  });

  const parsed = {
    hs: {counts, revenues, liteCounts, details},
    fpIn: fpInCounts, fpOut: fpOutCounts,
    fpInDetails, fpOutDetails,
    to: toCounts,
    uber: uberCounts,
    uberDetails,
    hsFreq: d.hsFreq || {},
    details,
  };

  state.results = buildResults(parsed);
  renderTable();
  document.getElementById('status').textContent = 'Datos: Febrero 2026';
})();

</script>
</body>
